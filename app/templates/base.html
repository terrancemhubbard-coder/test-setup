<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Health History{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/charts.js"></script>
</head>
<body>
  <header class="topbar">
    <h1>Health History</h1>
    <nav>
      <a href="/">Dashboard</a>
      <a href="/conditions/">Conditions</a>
      <a href="/medications/">Medications</a>
      <a href="/allergies/">Allergies</a>
      <a href="/providers/">Providers</a>
      <a href="/glucose/">Glucose</a>
      <a href="/a1c/">A1C</a>
      <a href="/bp/">Blood Pressure</a>
      <a href="/pad/">PAD Symptoms</a>
      <a href="/labs/">Labs</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
    <p class="disclaimer">Personal record-keeping tool only — not medical advice. Data is stored locally in a SQLite file and never leaves this machine.</p>
  </main>
</body>
</html>
